name: WargusHD Android cheat palette test APK

on:
  push:
    branches:
      - codex/wargushd-gameplay-options
    paths:
      - qa/wargushd-gameplay/build-request.json

permissions:
  contents: write

concurrency:
  group: wargushd-android-cheat-palette-test
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout owner-private test scripts
        uses: actions/checkout@v4
      - name: Checkout official GPL WargusHD at exact 3.4.91 release
        uses: actions/checkout@v4
        with:
          repository: nikoltu/WargusHD-android
          ref: v3.4.91
          submodules: recursive
          path: upstream-wargushd
          persist-credentials: false
      - name: Java 17 and Gradle cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: upstream-wargushd/android/gradle/wrapper/gradle-wrapper.properties
      - name: Reuse signed official release assets and its original unmodified engine
        run: |
          set -euo pipefail
          curl --retry 3 -fsSL -o "$RUNNER_TEMP/WargusHD-official.apk" \
            https://github.com/nikoltu/WargusHD-android/releases/download/v3.4.91/WargusHD-3.4.91.apk
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          import os
          a=Path(os.environ['RUNNER_TEMP'])/'WargusHD-official.apk'
          d=Path('upstream-wargushd/android/app/src/main')
          with zipfile.ZipFile(a) as src:
            lib='lib/arm64-v8a/libmain.so'
            assert src.getinfo(lib).file_size>1000000
            native=d/'jniLibs/arm64-v8a/libmain.so'
            native.parent.mkdir(parents=True,exist_ok=True)
            native.write_bytes(src.read(lib))
            names=[x for x in src.namelist() if x.startswith('assets/wargushd/') and not x.endswith('/')]
            assert len(names)>40 and 'assets/wargushd/scripts/cheats.lua' in names
            for n in names:
              target=d/n[len('assets/'):]
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(src.read(n))
            source=(d/'wargushd/scripts/cheats.lua')
            assert 'function HandleCheats(str)' in source.read_text(errors='replace')
            print('OFFICIAL_NATIVE_BYTES',native.stat().st_size)
            print('OFFICIAL_ASSETS_RESTORED',len(names))
          PY
      - name: Patch only Java controls, install separately from official APK
        run: |
          set -euo pipefail
          python3 qa/wargushd-gameplay/apply_cheat_palette.py upstream-wargushd
      - name: Compile side-by-side debug APK
        run: |
          set -euo pipefail
          cd upstream-wargushd/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Verify self-contained app ID, SDL bridge and complete game scripts
        run: |
          set -euo pipefail
          APK=upstream-wargushd/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, json,hashlib
          apk=Path('upstream-wargushd/android/app/build/outputs/apk/debug/app-debug.apk')
          with zipfile.ZipFile(apk) as z:
            assert z.testzip() is None
            items=z.namelist()
            assert 'lib/arm64-v8a/libmain.so' in items
            assert 'assets/wargushd/scripts/cheats.lua' in items
            assert 'glittering prizes' in z.read('assets/wargushd/scripts/cheats.lua').decode('utf-8',errors='replace')
            assert any(b'WargusHDKeys' in z.read(n) for n in items if n.startswith('classes') and n.endswith('.dex'))
            assert len(items)>130
          report={'status':'APK_COMPILED_CRC_VERIFIED_NOT_DEVICE_TESTED',
             'source':'nikoltu/WargusHD-android v3.4.91 official public APK + GPL source',
             'native_engine_unchanged':True,
             'additional_permissions':False,
             'side_by_side_app_id':'net.wargushd.game.cheats',
             'new_controls':['resources','game-speed-toggle','reveal-map','god-mode-toggle'],
             'unit_voice_mods_installed':False,
             'requires_original_own_game_data':True,
             'apk_bytes':apk.stat().st_size,
             'sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),
             'on_device_tested':False}
          Path('qa/wargushd-gameplay/report.json').write_text(json.dumps(report,indent=2)+'\n')
          print('QA_REPORT',json.dumps(report))
          PY
          SDK_TOOL="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$SDK_TOOL" dump badging "$APK" | grep -E '^package: name=|^application-label:' | head -3
          "$SDK_TOOL" dump badging "$APK" | grep -q "name='net.wargushd.game.cheats'"
          echo APK_MANIFEST_SEPARATE_APP_ID_VERIFIED
      - name: Save owner-only draft test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=wargushd-cheats-palette-test-20261102
          mkdir -p "$RUNNER_TEMP/out"
          cp upstream-wargushd/android/app/build/outputs/apk/debug/app-debug.apk \
            "$RUNNER_TEMP/out/WargusHD-Cheats-Palette-test.apk"
          cat > "$RUNNER_TEMP/out/README.txt" <<'DOC'
          WargusHD 3.4.91 - owner-only Android cheat toolbar prototype.
          Side-by-side test application (app ID net.wargushd.game.cheats).
          Original WargusHD is NOT overwritten or uninstalled.

          1. Install APK as a second application "WargusHD".
          2. Select the SAME Warcraft II: Remastered Data folder as the official app.
          3. Re-import Russian SPK units and SPK briefings mods in THIS app.
          4. Start a SOLO campaign mission or custom game.
          5. On game screen, top right: "ЧИТЫ".
          6. Tap one of the four functions, see result in game.
          7. Every cheat marks the game as cheated, score zero.
          8. Multiplayer LAN is deliberately unsupported.
          9. To revert, simply uninstall this TEST app; the original is untouched.

          Source changes under:
          https://github.com/constantinepetrov/android/tree/codex/wargushd-gameplay-options/qa/wargushd-gameplay

          WARNING: Built/ZIP-tested, NOT yet verified running on a Fold.
          DOC
          gh release create "$TAG" "$RUNNER_TEMP/out/WargusHD-Cheats-Palette-test.apk" \
            "$RUNNER_TEMP/out/README.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target codex/wargushd-gameplay-options --draft --prerelease \
            --title "WargusHD cheat palette (owner-only prototype)" \
            --notes "Separate-install test APK. Four single-player commands using the game's own cheat Lua; original application is untouched. ZIP and compilation verified; phone playback not tested."
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/out/releases.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path('qa/wargushd-gameplay/report.json')).read_text())
          all=json.loads((Path(os.environ['RUNNER_TEMP'])/'out/releases.json').read_text())
          one=next(x for x in all if x['tag_name']=='wargushd-cheats-palette-test-20261102')
          assert one['draft'] and not one.get('published_at')
          apk=next(x for x in one['assets'] if x['name']=='WargusHD-Cheats-Palette-test.apk')
          assert apk['size']==r['apk_bytes']
          assert apk['digest']=='sha256:'+r['sha256']
          print('PRIVATE_DRAFT_APK',one['html_url'])
          print('PRIVATE_APK_DOWNLOAD',apk['browser_download_url'])
          print('SHA256_VERIFIED',r['sha256'])
          PY
      - name: Upload QA only (no game assets) for diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: wargushd-cheat-palette-build-report
          path: qa/wargushd-gameplay/report.json
          if-no-files-found: ignore
          retention-days: 7
