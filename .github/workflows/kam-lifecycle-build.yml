name: KaM Android patched lifecycle APK build and cloud verification
on:
  push:
    branches: [codex/kam-lifecycle-qa]
    paths: [qa/lifecycle/build-request.json]
permissions:
  contents: read
concurrency:
  group: kam-lifecycle-patched-build
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    outputs:
      apk-sha: ${{ steps.hash.outputs.sha }}
      apk-id: ${{ steps.apk-upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: 
          persist-credentials: false
      - name: Use preinstalled JDK 17 without downloading an unverified action
        run: |
          test -x "$JAVA_HOME_17_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Select Linux FPC 3.2.2
        shell: bash
        timeout-minutes: 8
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq fp-compiler make git curl cmake ninja-build patch
          fpc -iV
      - name: Download and verify existing exact source APK from unpublished owner asset
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kam-input"
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 25 --max-time 490 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/constantinepetrov/android/releases/assets/701064241 \
            -o "$RUNNER_TEMP/kam-input/old.apk"
          test "$(stat -c%s "$RUNNER_TEMP/kam-input/old.apk")" = 856629249
          echo "c7df4b880984b9a475b57ee00b41fa5ba6140f4c21e5f688a9188ab1622169c4  $RUNNER_TEMP/kam-input/old.apk" | sha256sum -c -
          echo "KAM_OLD_APK=$RUNNER_TEMP/kam-input/old.apk" >> "$GITHUB_ENV"
      - name: Verify the patched Pascal lifecycle logic in a real compiler
        run: python3 qa/lifecycle/validate_lifecycle_pascal.py --source qa/lifecycle/overrides/KM_MainAndroid.inc
      - name: Build the original donor port plus the lifecycle fix on clean Linux runner
        timeout-minutes: 75
        shell: bash
        run: bash qa/lifecycle/build_patched_apk.sh
      - name: Preserve exact rebuilt APK SHA-256
        id: hash
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(sha256sum "$RUNNER_TEMP/kam-output/KaM_lifecycle_fix_debug.apk" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Temporary exact rebuilt APK for independent Android QA only
        id: apk-upload
        timeout-minutes: 10
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kam-lifecycle-patched-apk-${{ github.run_id }}
          path: ${{ runner.temp }}/kam-output/KaM_lifecycle_fix_debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Preserve build diagnostics without any game payload
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kam-lifecycle-build-log-${{ github.run_id }}
          path: lifecycle-build-evidence/
          if-no-files-found: warn
          retention-days: 7
  test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Retrieve and verify one APK from same build run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build.outputs.apk-id }}
          path: ${{ runner.temp }}/kam-patched
          merge-multiple: true
          digest-mismatch: error
      - name: Require exact built SHA
        env:
          EXPECTED: ${{ needs.build.outputs.apk-sha }}
        run: |
          test -f "$RUNNER_TEMP/kam-patched/KaM_lifecycle_fix_debug.apk"
          echo "$EXPECTED  $RUNNER_TEMP/kam-patched/KaM_lifecycle_fix_debug.apk" | sha256sum -c -
      - name: Prepare KVM and pinned Airtest
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -w /dev/kvm
          python -m venv "$RUNNER_TEMP/kam-airtest"
          "$RUNNER_TEMP/kam-airtest/bin/python" -m pip install -r qa/requirements-airtest-lock.txt
          echo "KAM_PYTHON=$RUNNER_TEMP/kam-airtest/bin/python" >> "$GITHUB_ENV"
      - name: Android API35 install, native engine, true game ticks and manual pause regression
        timeout-minutes: 39
        env:
          EXPECTED: ${{ needs.build.outputs.apk-sha }}
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 6G
          avd-name: kam-fixed
          emulator-boot-timeout: 480
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-options: >-
            -no-window -no-snapshot -no-audio -no-boot-anim -accel on -gpu swiftshader
            -camera-front none -camera-back none
          script: >-
            "$KAM_PYTHON" qa/android_cloud_qa.py
            --apk "$RUNNER_TEMP/kam-patched/KaM_lifecycle_fix_debug.apk"
            --expected-sha256 "$EXPECTED"
            --output "$GITHUB_WORKSPACE/qa-lifecycle-fixed/startup" --serial emulator-5554
            && "$KAM_PYTHON" qa/lifecycle/android_probe.py --serial emulator-5554
            --output "$GITHUB_WORKSPACE/qa-lifecycle-fixed/background" --expected fixed
            --apk-sha256 "$EXPECTED"
      - name: Preserve real patched Android findings
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kam-lifecycle-fixed-qa-${{ github.run_id }}
          path: qa-lifecycle-fixed/
          if-no-files-found: warn
          retention-days: 7
