name: Android client compilation probe
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'KaM_Remake.inc'
      - 'android-port/tests/**'
      - 'android-port/pascal/**'
      - 'android-port/host/pascal/**'
      - 'android-port/experiments/*.sh'
      - 'android-port/experiments/*.py'
      - '.github/workflows/android-client-probe.yml'
permissions:
  contents: read
jobs:
  source-scope:
    concurrency:
      group: ${{ github.workflow }}-scope-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/android-native-port'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_client: ${{ steps.scope.outputs.run_client }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - id: scope
        name: Skip heavy compilation for documentation-only updates
        env:
          COMPARE_BASE: ${{ github.event.before || github.event.pull_request.base.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo 'run_client=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git fetch --no-tags --depth=1 origin "$COMPARE_BASE"; then
            echo '::notice::Comparison commit unavailable; retain compilation rather than silently skip it'
            echo 'run_client=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$COMPARE_BASE" HEAD > changed-files.txt
          run_client=false
          while IFS= read -r path; do
            case "$path" in
              src/*|KaM_Remake.inc|android-port/tests/*|android-port/pascal/*|android-port/host/pascal/*|android-port/experiments/*.sh|android-port/experiments/*.py|.github/workflows/android-client-probe.yml)
                run_client=true; break ;;
            esac
          done < changed-files.txt
          echo "run_client=$run_client" >> "$GITHUB_OUTPUT"
  client-probe:
    concurrency:
      group: ${{ github.workflow }}-compile-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    needs: source-scope
    if: needs.source-scope.outputs.run_client == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: fpc/FPCSource
          ref: release_3_2_2
          path: fpc-source
      - uses: actions/checkout@v4
        with:
          repository: fpc/Lazarus
          ref: lazarus_4_0
          path: lazarus-source
      - name: Install bootstrap compiler and cross assembler
        run: |
          sudo apt-get update
          sudo apt-get install -y fp-compiler-3.2.2 fp-units-base-3.2.2 fp-units-fcl-3.2.2 libffi-dev binutils-aarch64-linux-gnu
      - name: Check Android-conditional KromUtils behavior on Linux
        run: |
          mkdir -p "$RUNNER_TEMP/krom-test"
          fpc -dANDROID -Mdelphi -Fi. -Fusrc/utils -FU"$RUNNER_TEMP/krom-test" -FE"$RUNNER_TEMP/krom-test" android-port/tests/kromutils_smoke.pas
          "$RUNNER_TEMP/krom-test/kromutils_smoke"
      - name: Check Android control input types and bounds
        shell: bash
        run: |
          set -o pipefail
          bash android-port/tests/test-controls-input-linux.sh 2>&1 | tee "$RUNNER_TEMP/controls-input.log"
      - name: Test clipboard and audio session contracts
        shell: bash
        run: |
          set -o pipefail
          bash android-port/tests/test-platform-services-linux.sh 2>&1 | tee "$RUNNER_TEMP/platform-services.log"
      - name: Test game options save/load on Linux
        shell: bash
        run: |
          set -o pipefail
          LAZUTILS_SOURCE="$GITHUB_WORKSPACE/lazarus-source/components/lazutils" PORT_TEST_DIR="$RUNNER_TEMP/game-options-test" \
            bash android-port/tests/test-game-options-linux.sh 2>&1 | tee "$RUNNER_TEMP/game-options-test.log"
      - name: Test real game messages and legacy serialization parity
        shell: bash
        run: |
          set -o pipefail
          LAZUTILS_SOURCE="$GITHUB_WORKSPACE/lazarus-source/components/lazutils" PORT_TEST_DIR="$RUNNER_TEMP/game-messages" bash android-port/tests/test-game-messages-linux.sh 2>&1 | tee "$RUNNER_TEMP/game-messages.log"
      - name: Test game presentation save-state port on Linux
        shell: bash
        run: |
          set -o pipefail
          LAZUTILS_SOURCE="$GITHUB_WORKSPACE/lazarus-source/components/lazutils" PORT_TEST_DIR="$RUNNER_TEMP/game-presentation-port" \
            bash android-port/tests/test-game-presentation-port-linux.sh 2>&1 | tee "$RUNNER_TEMP/game-presentation-port.log"
      - name: Compile real map header probe (no game data bundled)
        shell: bash
        run: |
          set -o pipefail
          LAZUTILS_SOURCE="$GITHUB_WORKSPACE/lazarus-source/components/lazutils" PORT_TEST_DIR="$RUNNER_TEMP/map-header-test" \
            bash android-port/tests/test-map-header-linux.sh 2>&1 | tee "$RUNNER_TEMP/map-header-build.log"
      - name: Measure FPC RTTI invocation support on Linux
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/rtti-test"
          fpc -Mdelphi -FU"$RUNNER_TEMP/rtti-test" -FE"$RUNNER_TEMP/rtti-test" android-port/tests/fpc_rtti_probe.pas
          set +e
          "$RUNNER_TEMP/rtti-test/fpc_rtti_probe" | tee "$RUNNER_TEMP/rtti-probe.log"
          status=${PIPESTATUS[0]}
          set -e
          # Exit 2 records an unavailable call manager; do not claim RTTI support.
          test "$status" -eq 0 || test "$status" -eq 2
      - name: Test platform-neutral font identifiers
        run: PORT_TEST_DIR="$RUNNER_TEMP/font-types" bash android-port/tests/test-font-types-linux.sh
      - name: Test Android PNG codec round-trip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/png-codec"
          paths=()
          while IFS= read -r -d '' path; do paths+=("-Fu$path" "-Fi$path"); done < <(find "$GITHUB_WORKSPACE/src" -type d -print0)
          fpc -Mdelphi -dANDROID -Fi"$GITHUB_WORKSPACE" -Fi"$GITHUB_WORKSPACE/lazarus-source/components/lazutils" \
            -Fu"$GITHUB_WORKSPACE/lazarus-source/components/lazutils" "${paths[@]}" \
            -FU"$RUNNER_TEMP/png-codec" -FE"$RUNNER_TEMP/png-codec" android-port/tests/png_codec_smoke.pas
          "$RUNNER_TEMP/png-codec/png_codec_smoke"
      - name: Test real terrain type operations on Linux
        run: LAZUTILS_SOURCE="$GITHUB_WORKSPACE/lazarus-source/components/lazutils" PORT_TEST_DIR="$RUNNER_TEMP/terrain-types" bash android-port/tests/test-terrain-types-linux.sh
      - name: Test Android unit CSV exporter with synthetic data
        run: LAZUTILS_SOURCE="$GITHUB_WORKSPACE/lazarus-source/components/lazutils" PORT_TEST_DIR="$RUNNER_TEMP/resunits-csv" bash android-port/tests/test-resunits-csv-linux.sh
      - name: Test real fog-of-war state update on Linux
        shell: bash
        run: |
          set -o pipefail
          LAZUTILS_SOURCE="$GITHUB_WORKSPACE/lazarus-source/components/lazutils" PORT_TEST_DIR="$RUNNER_TEMP/fog-game" \
            bash android-port/tests/test-fog-state-linux.sh 2>&1 | tee "$RUNNER_TEMP/fog-game-test.log"
      - name: Run Pascal Script game-type invocation on Linux
        shell: bash
        run: |
          set -o pipefail
          LAZUTILS_SOURCE="$GITHUB_WORKSPACE/lazarus-source/components/lazutils" PORT_TEST_DIR="$RUNNER_TEMP/ps-game" \
            bash android-port/tests/test-pascal-script-linux.sh 2>&1 | tee "$RUNNER_TEMP/ps-game-test.log"
      - name: Compare FPC 3.2.2 libffi manager ABI on Linux
        shell: bash
        run: |
          set -o pipefail
          FPC_SOURCE="$GITHUB_WORKSPACE/fpc-source" LAZUTILS_SOURCE="$GITHUB_WORKSPACE/lazarus-source/components/lazutils" PORT_TEST_DIR="$RUNNER_TEMP/ffi-abi" \
            bash android-port/tests/test-ffi-abi-linux.sh 2>&1 | tee "$RUNNER_TEMP/ffi-abi-test.log"
      - name: Probe Pascal Script FPC invocation adapter on Linux
        shell: bash
        run: |
          set -o pipefail
          LAZUTILS_SOURCE="$GITHUB_WORKSPACE/lazarus-source/components/lazutils" FFI_FIXED_SOURCE="$RUNNER_TEMP/ffi-abi/fixed" PORT_TEST_DIR="$RUNNER_TEMP/ps-compat" \
            bash android-port/tests/test-pascalscript-compat-linux.sh 2>&1 | tee "$RUNNER_TEMP/ps-compat-linux.log"
      - name: Cache FPC cross compiler
        id: fpc-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fpc-android
          key: fpc-0d122c49-aarch64-android-ubuntu-24.04-v2
      - name: Build experimental FPC Android cross compiler and RTL
        if: steps.fpc-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/fpc-android"
          make -C fpc-source crossall crossinstall CPU_TARGET=aarch64 OS_TARGET=android \
            BINUTILSPREFIX=aarch64-linux-gnu- INSTALL_PREFIX="$RUNNER_TEMP/fpc-android" \
            2>&1 | tee "$RUNNER_TEMP/cross-build.log"
      - name: Compile diagnostic FPC-compatible Pascal Script overlay for Android
        shell: bash
        run: |
          set -o pipefail
          compiler=$(find "$RUNNER_TEMP/fpc-android" -type f \( -name ppcrossa64 -o -name ppca64 \) -print -quit)
          units=$(find "$RUNNER_TEMP/fpc-android" -type d -path '*/units/aarch64-android' -print -quit)
          test -n "$compiler" && test -n "$units"
          python3 android-port/experiments/prepare-pascalscript-fpc.py src/ext/pascalscript_submodule/Source "$RUNNER_TEMP/ps-android-overlay"
          mkdir -p "$RUNNER_TEMP/ps-android-units"
          for unit in uPSRuntime.pas uPSCompiler.pas; do
            "$compiler" -Paarch64 -Tandroid -XPaarch64-linux-gnu- -Mdelphi -B -Cn -Fi"$GITHUB_WORKSPACE" \
              "-Fu$units/*" "-Fu$RUNNER_TEMP/ps-android-overlay" "-Fi$RUNNER_TEMP/ps-android-overlay" \
              "-FU$RUNNER_TEMP/ps-android-units" "$RUNNER_TEMP/ps-android-overlay/$unit"
          done 2>&1 | tee "$RUNNER_TEMP/ps-android-overlay.log"
      - name: Compile KM_Game with diagnostic overlay (expected blockers retained)
        shell: bash
        run: |
          set -o pipefail
          compiler=$(find "$RUNNER_TEMP/fpc-android" -type f \( -name ppcrossa64 -o -name ppca64 \) -print -quit)
          units=$(find "$RUNNER_TEMP/fpc-android" -type d -path '*/units/aarch64-android' -print -quit)
          set +e
          FPC_ANDROID="$compiler" FPC_ANDROID_UNITS="$units" LAZUTILS_SOURCE="$GITHUB_WORKSPACE/lazarus-source/components/lazutils" LCL_SOURCE="$GITHUB_WORKSPACE/lazarus-source/lcl" PS_OVERLAY="$RUNNER_TEMP/ps-android-overlay" PORT_BUILD_DIR="$RUNNER_TEMP/client-overlay-units" \
            bash android-port/experiments/compile-game-android.sh 2>&1 | tee "$RUNNER_TEMP/client-overlay.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "Diagnostic overlay compiler exit: $status"
          if [ "$status" -ne 0 ]; then echo "Known diagnostics captured; no production patch applied"; fi
      - name: Compile actual KM_Game client unit
        shell: bash
        run: |
          set -o pipefail
          compiler=$(find "$RUNNER_TEMP/fpc-android" -type f \( -name ppcrossa64 -o -name ppca64 \) -print -quit)
          units=$(find "$RUNNER_TEMP/fpc-android" -type d -path '*/units/aarch64-android' -print -quit)
          test -n "$compiler" && test -n "$units"
          FPC_ANDROID="$compiler" FPC_ANDROID_UNITS="$units" LAZUTILS_SOURCE="$GITHUB_WORKSPACE/lazarus-source/components/lazutils" LCL_SOURCE="$GITHUB_WORKSPACE/lazarus-source/lcl" PORT_BUILD_DIR="$RUNNER_TEMP/client-units" PORT_TARGETS="src/game/KM_Game.pas" \
            bash android-port/experiments/compile-game-android.sh 2>&1 | tee "$RUNNER_TEMP/client-build.log"
      - name: Preserve diagnostic logs and generated units
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-client-probe
          path: |
            ${{ runner.temp }}/cross-build.log
            ${{ runner.temp }}/client-build.log
            ${{ runner.temp }}/rtti-probe.log
            ${{ runner.temp }}/ffi-abi-test.log
            ${{ runner.temp }}/ps-game-test.log
            ${{ runner.temp }}/fog-game-test.log
            ${{ runner.temp }}/ps-compat-linux.log
            ${{ runner.temp }}/ps-android-overlay.log
            ${{ runner.temp }}/client-overlay.log
            ${{ runner.temp }}/ps-android-units/
            ${{ runner.temp }}/game-options-test.log
            ${{ runner.temp }}/controls-input.log
            ${{ runner.temp }}/platform-services.log
            ${{ runner.temp }}/game-presentation-port.log
            ${{ runner.temp }}/game-messages.log
            ${{ runner.temp }}/map-header-build.log
            ${{ runner.temp }}/client-units/
          if-no-files-found: warn
