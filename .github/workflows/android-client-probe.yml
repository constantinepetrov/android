name: Android client compilation probe
on:
  workflow_dispatch:
  push:
    branches: [codex/android-native-port]
  pull_request:
    paths:
      - 'android-port/**'
      - '.github/workflows/android-client-probe.yml'
permissions:
  contents: read
jobs:
  client-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: fpc/FPCSource
          ref: release_3_2_2
          path: fpc-source
      - uses: actions/checkout@v4
        with:
          repository: fpc/Lazarus
          ref: lazarus_4_0
          path: lazarus-source
      - name: Install bootstrap compiler and cross assembler
        run: |
          sudo apt-get update
          sudo apt-get install -y fp-compiler-3.2.2 fp-units-base-3.2.2 binutils-aarch64-linux-gnu
      - name: Check Android-conditional KromUtils behavior on Linux
        run: |
          mkdir -p "$RUNNER_TEMP/krom-test"
          fpc -dANDROID -Mdelphi -Fi. -Fusrc/utils -FU"$RUNNER_TEMP/krom-test" -FE"$RUNNER_TEMP/krom-test" android-port/tests/kromutils_smoke.pas
          "$RUNNER_TEMP/krom-test/kromutils_smoke"
      - name: Measure FPC RTTI invocation support on Linux
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/rtti-test"
          fpc -Mdelphi -FU"$RUNNER_TEMP/rtti-test" -FE"$RUNNER_TEMP/rtti-test" android-port/tests/fpc_rtti_probe.pas
          set +e
          "$RUNNER_TEMP/rtti-test/fpc_rtti_probe" | tee "$RUNNER_TEMP/rtti-probe.log"
          status=${PIPESTATUS[0]}
          set -e
          # Exit 2 records an unavailable call manager; do not claim RTTI support.
          test "$status" -eq 0 || test "$status" -eq 2
      - name: Cache FPC cross compiler
        id: fpc-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fpc-android
          key: fpc-3.2.2-aarch64-android-ubuntu-24.04-v1
      - name: Build experimental FPC Android cross compiler and RTL
        if: steps.fpc-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/fpc-android"
          make -C fpc-source crossall crossinstall CPU_TARGET=aarch64 OS_TARGET=android \
            BINUTILSPREFIX=aarch64-linux-gnu- INSTALL_PREFIX="$RUNNER_TEMP/fpc-android" \
            2>&1 | tee "$RUNNER_TEMP/cross-build.log"
      - name: Compile actual KM_Game client unit
        shell: bash
        run: |
          set -o pipefail
          compiler=$(find "$RUNNER_TEMP/fpc-android" -type f \( -name ppcrossa64 -o -name ppca64 \) -print -quit)
          units=$(find "$RUNNER_TEMP/fpc-android" -type d -path '*/units/aarch64-android' -print -quit)
          test -n "$compiler" && test -n "$units"
          FPC_ANDROID="$compiler" FPC_ANDROID_UNITS="$units" LAZUTILS_SOURCE="$GITHUB_WORKSPACE/lazarus-source/components/lazutils" LCL_SOURCE="$GITHUB_WORKSPACE/lazarus-source/lcl" PORT_BUILD_DIR="$RUNNER_TEMP/client-units" \
            bash android-port/experiments/compile-game-android.sh 2>&1 | tee "$RUNNER_TEMP/client-build.log"
      - name: Preserve diagnostic logs and generated units
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-client-probe
          path: |
            ${{ runner.temp }}/cross-build.log
            ${{ runner.temp }}/client-build.log
            ${{ runner.temp }}/rtti-probe.log
            ${{ runner.temp }}/client-units/
          if-no-files-found: warn
