name: KaM cloud Android QA

# Changing this one request file on this one branch is the explicit run trigger.
on:
  push:
    branches:
      - codex/kam-cloud-qa
    paths:
      - qa/run-request.json

permissions:
  contents: read

concurrency:
  group: kam-cloud-qa
  cancel-in-progress: false

jobs:
  request:
    name: Read the explicit QA request and scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      game-check: ${{ steps.scope.outputs.game-check }}
      input-source: ${{ steps.scope.outputs.input-source }}
      request-id: ${{ steps.scope.outputs.request-id }}
      ui-session: ${{ steps.scope.outputs.ui-session }}
    steps:
      - name: Check out the requested QA revision
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate the requested scope
        id: scope
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          request = json.loads(Path("qa/run-request.json").read_text())
          mode = request.get("mode", "full")
          if mode not in {"full", "readiness-only"}:
              raise SystemExit("Unknown QA mode")
          source = request.get("input_source", "official")
          if source not in {"official", "relay"}:
              raise SystemExit("Unknown input source")
          request_id = request.get("request_id", "")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,100}", request_id):
              raise SystemExit("Invalid request ID")
          ui_session = request.get("ui_session", False)
          if type(ui_session) is not bool:
              raise SystemExit("ui_session must be a boolean")
          if ui_session and (mode != "full" or source != "relay"):
              raise SystemExit("UI session requires full mode and the relay dependency setup")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("game-check=" + ("true" if mode == "full" else "false") + "\n")
              output.write("input-source=" + source + "\n")
              output.write("request-id=" + request_id + "\n")
              output.write("ui-session=" + str(ui_session).lower() + "\n")
          print(json.dumps({"mode": mode, "input_source": source, "game_execution_requested": mode == "full", "ui_session": ui_session}))
          PY

  fetch-input:
    name: Fetch pinned official data through the macOS network
    needs: request
    if: ${{ needs.request.outputs.game-check == 'true' && needs.request.outputs.input-source == 'official' }}
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      installer-artifact-id: ${{ steps.installer-upload.outputs.artifact-id }}
    steps:
      - name: Check out the requested QA revision
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Select Python 3.12
        timeout-minutes: 3
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Fetch and verify the official installer
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kam-installer" "$GITHUB_WORKSPACE/input-evidence"
          uname -a > input-evidence/host.txt
          python qa/fetch_official_installer.py \
            --output "$RUNNER_TEMP/kam-installer/KaM-Remake-Beta-r16397.exe" \
            --evidence "$GITHUB_WORKSPACE/input-evidence"
      - name: Transfer only the verified installer to this run
        id: installer-upload
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kam-temporary-installer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kam-installer/KaM-Remake-Beta-r16397.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Preserve installer network diagnostics
        if: ${{ always() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kam-input-network-${{ github.run_id }}-${{ github.run_attempt }}
          path: input-evidence/
          if-no-files-found: warn
          retention-days: 7

  android-readiness:
    name: Verify Android and Airtest independently of game data
    needs: request
    if: ${{ needs.request.outputs.game-check != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out the requested QA revision
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Select Python 3.12
        timeout-minutes: 3
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Prepare KVM, Airtest and isolated evidence
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/readiness-evidence"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm
          test -w /dev/kvm
          ls -l /dev/kvm > readiness-evidence/kvm.txt
          python -m venv "$RUNNER_TEMP/kam-airtest"
          "$RUNNER_TEMP/kam-airtest/bin/python" -m pip install -r qa/requirements-airtest-lock.txt
          "$RUNNER_TEMP/kam-airtest/bin/python" -m pip check
          printf 'KAM_AIRTEST_PYTHON=%s\n' "$RUNNER_TEMP/kam-airtest/bin/python" >> "$GITHUB_ENV"
      - name: Boot Android and capture the independent readiness probe
        timeout-minutes: 20
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 6G
          avd-name: kam-readiness
          force-avd-creation: true
          emulator-port: 5554
          emulator-boot-timeout: 480
          disable-linux-hw-accel: false
          disable-animations: true
          channel: stable
          emulator-options: >-
            -no-window -no-snapshot -no-audio -no-boot-anim
            -accel on -gpu swiftshader
            -camera-back none -camera-front none
          pre-emulator-launch-script: |
            "$ANDROID_HOME/emulator/emulator" -accel-check > readiness-evidence/accel-check.txt 2>&1
            "$ANDROID_HOME/emulator/emulator" -no-window -no-audio -version > readiness-evidence/emulator-version.txt 2>&1
            cat "$ANDROID_HOME/system-images/android-35/google_apis/x86_64/source.properties" > readiness-evidence/system-image-properties.txt
          script: >-
            "$KAM_AIRTEST_PYTHON" qa/probe_android.py
            --output "$GITHUB_WORKSPACE/readiness-evidence/runtime"
            --serial emulator-5554
      - name: Preserve independent Android evidence
        if: ${{ always() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kam-android-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: readiness-evidence/
          if-no-files-found: error
          retention-days: 7

  android-qa:
    name: Android API 35 with ARM64 translation
    needs: [request, fetch-input]
    if: ${{ always() && needs.request.result == 'success' && needs.request.outputs.game-check == 'true' && (needs.fetch-input.result == 'success' || needs.request.outputs.input-source == 'relay') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      relay-artifact-id: ${{ steps.relay-finalize.outputs.artifact-id }}
      handshake-artifact-id: ${{ steps.relay-handshake.outputs.artifact-id }}
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out the requested QA revision
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Prepare isolated paths and evidence directory
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kam-input" "$GITHUB_WORKSPACE/qa-artifacts"
          {
            printf 'KAM_APK_PATH=%s\n' "$RUNNER_TEMP/kam-input/app.apk"
            printf 'KAM_QA_OUTPUT=%s\n' "$GITHUB_WORKSPACE/qa-artifacts"
            printf 'KAM_AIRTEST_PYTHON=%s\n' "$RUNNER_TEMP/kam-airtest/bin/python"
          } >> "$GITHUB_ENV"
          cp qa/run-request.json qa-artifacts/run-request.json
          uname -a > qa-artifacts/host.txt
          df -h > qa-artifacts/disk-before-setup.txt
          printf '%s\n' "$GITHUB_SHA" > qa-artifacts/qa-commit.txt

      - name: Select Python 3.12
        timeout-minutes: 3
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned input relay dependencies
        if: ${{ needs.request.outputs.input-source == 'relay' }}
        timeout-minutes: 3
        run: npm ci --prefix qa/input-relay --ignore-scripts --no-audit --no-fund

      - name: Prepare one encrypted APK transfer
        if: ${{ needs.request.outputs.input-source == 'relay' }}
        id: relay-prepare
        timeout-minutes: 2
        uses: ./qa/input-relay
        with:
          mode: prepare
          request-id: ${{ needs.request.outputs.request-id }}

      - name: Publish only the encrypted transfer handshake
        if: ${{ needs.request.outputs.input-source == 'relay' }}
        id: relay-handshake
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kam-transfer-handshake-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kam-relay-handshake/transport.json
          if-no-files-found: error
          retention-days: 1

      - name: Wait for this run's encrypted upload receipt
        if: ${{ needs.request.outputs.input-source == 'relay' }}
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
          RELAY_REQUEST_ID: ${{ needs.request.outputs.request-id }}
        run: >-
          python qa/wait_relay_receipt.py
          --request-id "$RELAY_REQUEST_ID"
          --output "$RUNNER_TEMP/kam-relay-receipt.json"
          --timeout 660

      - name: Finalize this run's encrypted artifact
        if: ${{ needs.request.outputs.input-source == 'relay' }}
        id: relay-finalize
        timeout-minutes: 2
        uses: ./qa/input-relay
        with:
          mode: finalize
          request-id: ${{ needs.request.outputs.request-id }}
          receipt-path: ${{ runner.temp }}/kam-relay-receipt.json

      - name: Receive the encrypted APK in the same job
        if: ${{ needs.request.outputs.input-source == 'relay' }}
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.relay-finalize.outputs.artifact-id }}
          path: ${{ runner.temp }}/kam-encrypted-input
          merge-multiple: true
          digest-mismatch: error

      - name: Decrypt and verify the exact original APK
        if: ${{ needs.request.outputs.input-source == 'relay' }}
        timeout-minutes: 3
        uses: ./qa/input-relay
        env:
          KAM_ENCRYPTED_APK_PATH: ${{ runner.temp }}/kam-encrypted-input/app.apk.enc
        with:
          mode: decrypt
          request-id: ${{ needs.request.outputs.request-id }}

      - name: Enable and verify KVM access
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm
          test -w /dev/kvm
          ls -l /dev/kvm > "$KAM_QA_OUTPUT/kvm.txt"

      - name: Install the isolated Airtest environment
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/kam-airtest"
          "$KAM_AIRTEST_PYTHON" -m pip install -r qa/requirements-airtest-lock.txt
          "$KAM_AIRTEST_PYTHON" -m pip check
          "$KAM_AIRTEST_PYTHON" -m pip freeze > "$KAM_QA_OUTPUT/installed-python-packages.txt"
          "$KAM_AIRTEST_PYTHON" - <<'PY'
          import importlib.metadata
          import json
          import os
          import sys
          from pathlib import Path
          import airtest.core.api
          import cv2

          version = importlib.metadata.version("airtest")
          if version != "1.4.3":
              raise SystemExit(f"Unexpected Airtest version: {version}")
          receipt = {
              "scope": "Host imports only; no Android or game test has run",
              "python": sys.version,
              "airtest": version,
              "opencv": cv2.__version__,
          }
          (Path(os.environ["KAM_QA_OUTPUT"]) / "airtest-host.json").write_text(
              json.dumps(receipt, indent=2) + "\n"
          )
          PY

      - name: Receive the verified installer from this workflow
        if: ${{ needs.request.outputs.input-source == 'official' }}
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.fetch-input.outputs.installer-artifact-id }}
          path: ${{ runner.temp }}/kam-installer
          merge-multiple: true
          digest-mismatch: error

      - name: Restore the exact signed APK from the official game data
        if: ${{ needs.request.outputs.input-source == 'official' }}
        timeout-minutes: 14
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y innoextract
          innoextract --version > "$KAM_QA_OUTPUT/innoextract-version.txt"
          python qa/prepare_inputs.py \
            --work-dir "$RUNNER_TEMP/kam-input" \
            --output-apk "$KAM_APK_PATH" \
            --evidence "$KAM_QA_OUTPUT" \
            --installer "$RUNNER_TEMP/kam-installer/KaM-Remake-Beta-r16397.exe"

      - name: Require the prepared APK and adequate host disk
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          apk = Path(os.environ["KAM_APK_PATH"])
          output = Path(os.environ["KAM_QA_OUTPUT"])
          free = shutil.disk_usage(apk.parent).free
          result = {
              "apk_path": str(apk),
              "apk_exists": apk.is_file(),
              "host_free_bytes": free,
              "required_free_bytes": 8 * 1024**3,
              "gameplay_pass": False,
          }
          (output / "host-preflight.json").write_text(json.dumps(result, indent=2) + "\n")
          if not apk.is_file():
              raise SystemExit("Prepared APK is missing: the reconstruction step must create KAM_APK_PATH")
          if free < result["required_free_bytes"]:
              raise SystemExit("Insufficient host disk before Android setup (8 GiB required)")
          PY

      - name: Run the bounded Android and game checks
        timeout-minutes: 38
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          GH_TOKEN: ${{ github.token }}
          KAM_UI_ENABLED: ${{ needs.request.outputs.ui-session }}
          KAM_UI_REQUEST_ID: ${{ needs.request.outputs.request-id }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 6G
          avd-name: kam-cloud-qa
          force-avd-creation: true
          emulator-port: 5554
          emulator-boot-timeout: 480
          disable-linux-hw-accel: false
          disable-animations: true
          channel: stable
          emulator-options: >-
            -no-window -no-snapshot -no-audio -no-boot-anim
            -accel on -gpu swiftshader
            -camera-back none -camera-front none
          pre-emulator-launch-script: |
            "$ANDROID_HOME/emulator/emulator" -accel-check > "$KAM_QA_OUTPUT/accel-check.txt" 2>&1
            "$ANDROID_HOME/emulator/emulator" -no-window -no-audio -version > "$KAM_QA_OUTPUT/emulator-version.txt" 2>&1
            cat "$ANDROID_HOME/system-images/android-35/google_apis/x86_64/source.properties" > "$KAM_QA_OUTPUT/system-image-properties.txt"
            df -h > "$KAM_QA_OUTPUT/disk-before-boot.txt"
          # The Python runner owns readiness, ABI, APK identity and game gates,
          # and captures its diagnostics in finally before this action stops AVD.
          script: |
            "$KAM_AIRTEST_PYTHON" qa/android_cloud_qa.py --apk "$KAM_APK_PATH" --output "$KAM_QA_OUTPUT/runtime" --serial emulator-5554
            "$KAM_AIRTEST_PYTHON" qa/gameplay_session.py --enabled "$KAM_UI_ENABLED" --serial emulator-5554 --output "$KAM_QA_OUTPUT/ui-session" --request-id "$KAM_UI_REQUEST_ID" --timeout 1200

      - name: Upload bounded QA evidence
        if: ${{ always() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kam-cloud-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qa-artifacts/**/*.json
            qa-artifacts/**/*.jsonl
            qa-artifacts/**/*.log
            qa-artifacts/**/*.txt
            qa-artifacts/**/*.stdout
            qa-artifacts/**/*.stderr
            qa-artifacts/**/*.gz
            qa-artifacts/**/*.png
            qa-artifacts/**/*.html
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
          include-hidden-files: false

      - name: Remove local relay secrets and ciphertext
        if: ${{ always() && needs.request.outputs.input-source == 'relay' }}
        timeout-minutes: 1
        run: |
          rm -f "$RUNNER_TEMP/kam-relay-state.json" "$RUNNER_TEMP/kam-relay-receipt.json"
          rm -f "$RUNNER_TEMP/kam-encrypted-input/app.apk.enc"

  remove-temporary-input:
    name: Remove only this run's temporary input artifacts
    needs: [fetch-input, android-qa]
    if: ${{ always() && (needs.fetch-input.outputs.installer-artifact-id != '' || needs.android-qa.outputs.relay-artifact-id != '' || needs.android-qa.outputs.handshake-artifact-id != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Verify artifact ownership and remove the consumed transfer
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_ARTIFACT_ID: ${{ needs.fetch-input.outputs.installer-artifact-id }}
          RELAY_ARTIFACT_ID: ${{ needs.android-qa.outputs.relay-artifact-id }}
          HANDSHAKE_ARTIFACT_ID: ${{ needs.android-qa.outputs.handshake-artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess

          for variable, prefix in (
              ("INSTALLER_ARTIFACT_ID", "kam-temporary-installer"),
              ("RELAY_ARTIFACT_ID", "kam-encrypted-apk"),
              ("HANDSHAKE_ARTIFACT_ID", "kam-transfer-handshake"),
          ):
              artifact_id = os.environ.get(variable, "")
              if not artifact_id:
                  continue
              assert artifact_id.isdigit()
              expected_name = prefix + "-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"]
              endpoint = "repos/" + os.environ["GITHUB_REPOSITORY"] + "/actions/artifacts/" + artifact_id
              item = json.loads(subprocess.check_output(["gh", "api", endpoint]))
              assert item["id"] == int(artifact_id)
              assert item["name"] == expected_name
              assert item["workflow_run"]["id"] == int(os.environ["GITHUB_RUN_ID"])
              subprocess.run(["gh", "api", "--method", "DELETE", endpoint], check=True)
              print("Removed verified temporary input artifact " + artifact_id)
          PY
