plugins { id 'com.android.application' }
android {
    namespace 'com.kamremake.androidprobe'
    compileSdk 35
    defaultConfig {
        applicationId 'com.kamremake.androidprobe'
        testInstrumentationRunner 'com.kamremake.androidprobe.GestureInstrumentation'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1-probe'
        ndk { abiFilters 'arm64-v8a' }
    }
}
